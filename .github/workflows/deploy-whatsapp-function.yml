name: Deploy JIVAAN WhatsApp functions

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/send-footwear-token/**'
      - 'supabase/functions/whatsapp-webhook/**'
      - '.github/workflows/deploy-whatsapp-function.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase link --project-ref yqgoebdtujjiyxclmbyr
          supabase functions deploy send-footwear-token --project-ref yqgoebdtujjiyxclmbyr --yes
          supabase functions deploy whatsapp-webhook --project-ref yqgoebdtujjiyxclmbyr --no-verify-jwt --yes
